<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b13">
  <title>MooGold — You're offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #071b13;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .brand {
      margin-bottom: 42px;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .symbol {
      width: 76px;
      height: 76px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 50%;
      color: #62d6a2;
      font-size: 34px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }
    p {
      margin: 0 auto;
      max-width: 340px;
      color: #b9c9c1;
      font-size: 15px;
      line-height: 1.7;
    }
    button {
      margin-top: 28px;
      padding: 14px 25px;
      border: 0;
      border-radius: 10px;
      background: #138a5d;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">MooGold</div>
    <div class="symbol" aria-hidden="true">↗</div>
    <h1>You're currently offline</h1>
    <p>
      Your internet connection is unavailable. Please reconnect to the
      internet and try again. Your account and financial information
      remain protected.
    </p>
    <button type="button" onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
